# ⚠️ `appId` GÜNCELLEME KİMLİĞİDİR. 8 Ağu 2026'da marka değişiminde
# `com.unityarchitect.ai` → `com.gamachine.app` yapıldı. Bedeli bilinerek ödendi:
# NSIS `oneClick` yalnız AYNI appId'nin eski sürümünü kaldırdığı için eski
# "Unity Architect AI" kurulumu silinmiyor ve mevcut kullanıcılar güncelleme
# bildirimi almıyor. O anda kurulu taban 3 indirmeydi — bu maliyet zamanla
# BÜYÜYOR, o yüzden şimdi yapıldı.
#
# ⚠️ Yukarıdaki iki eski dize BİLEREK duruyor: yorumun anlattığı şey NEYDEN
# değişildiği. Otomatik bir yeniden adlandırma betiği bunları da ezdi ve cümle
# "com.gamachine.app'dan com.gamachine.app'a değiştirildi" haline geldi — yani
# yorum yanlış bir olguyu belgeliyordu. Bir sonraki toplu değiştirmede bu bloğu
# hariç tut.
appId: com.gamachine.app
# ⚠️ "Ad tek kelime olunca noktalı-ad tuzağı biter" İDDİASI ÇÜRÜDÜ (8 Ağu 2026).
# Ad `Gamachine` yapıldı, asset yine `Gamachine.Setup.3.0.0.exe` diye yüklendi:
# boşluk üründen değil NSIS şablonundan (`${productName} Setup ${version}`)
# geliyor. Kalıcı çözüm aşağıdaki `nsis.artifactName` (v3.0.3'te eklendi).
productName: Gamachine
# Signs every nested Mach-O under Contents/Resources (backend, uv, cua-driver,
# OmniSharp/.NET) deepest-first: with the Developer ID when one is available, else
# ad-hoc together with the frameworks, helpers and the app. See the mac block below.
afterPack: scripts/sign-mac-nested.js
copyright: Copyright © 2026 Burak Emre Erdemci
directories:
  output: build
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
extraResources:
  # Pencere ikonu runtime'da erişilebilir olsun (BrowserWindow icon → görev çubuğu).
  # Exe/installer ikonu zaten buildResources/resources/icon.ico'dan otomatik gömülür.
  - from: resources/icon.ico
    to: icon.ico
  # Lisans metinleri kurulan uygulamanın İÇİNDE olmak zorunda — bu bir tercih değil
  # dağıtım koşulu: gömülü ffmpeg (LGPL) lisans metninin ikiliyle birlikte
  # verilmesini, MIT bileşenler ise telif+izin bildiriminin "tüm kopyalarda" yer
  # almasını şart koşuyor. 8 Ağu 2026'da paketlenmiş çıktıdan ölçüldü: içeride
  # yalnızca Electron'un kendi lisansları vardı, bu iki dosya HİÇ girmiyordu.
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  # unity-mcp fork'unun kökündeki MIT lisansı (CoplayDev). Aşağıda Server/ ve
  # MCPForUnity/ ayrı ayrı kopyalandığı için kök LICENSE arada kaynıyordu.
  - from: ../../unity-mcp/LICENSE
    to: unity-mcp/LICENSE
  - from: ../../Backend/dist/backend
    to: Backend
    filter:
      - "**/*"
  # Launcher scriptleri frozen 'backend' binary'sinin yanına (Backend kökü) —
  # paketlenmiş app'te MCP/agy köprüsü bunlar üzerinden binary'yi çağırır.
  # macOS/Linux: .sh + unityai (bash); Windows: .cmd. Hepsi paketlenir, OS'e göre
  # Python tarafı (cli_base._launcher_path) doğru olanı seçer.
  - from: ../../Backend/run_mcp_server.sh
    to: Backend/run_mcp_server.sh
  - from: ../../Backend/unityai
    to: Backend/unityai
  - from: ../../Backend/run_mcp_server.cmd
    to: Backend/run_mcp_server.cmd
  - from: ../../Backend/unityai.cmd
    to: Backend/unityai.cmd
  # Unity MCP sunucu kaynağı + Unity paketi (uvx --from ve install_package bunları kullanır)
  - from: ../../unity-mcp/Server
    to: unity-mcp/Server
    filter:
      - "**/*"
      # A developer's local venv (gitignored) links to their Homebrew Python; never ship it.
      - "!.venv{,/**}"
      - "!tests{,/**}"
      - "!build{,/**}"
      - "!**/__pycache__{,/**}"
      - "!**/*.pyc"
  - from: ../../unity-mcp/MCPForUnity
    to: unity-mcp/MCPForUnity
    filter:
      - "**/*"
      - "!**/__pycache__{,/**}"
  # uv araç zinciri gömülü — kullanıcının PC'sinde uv kurulu olmasa da MCP çalışsın
  - from: ../../Backend/vendor/uv
    to: uv
    filter:
      - "**/*"
      # Intel Macs are not supported (29 Oct 2026); a darwin-x64 folder left over
      # from an older fetch_uv.sh must not ship.
      - "!darwin-x64{,/**}"
  # OmniSharp-Roslyn sidecar (C# diagnostics + IntelliSense).
  # Ana klasörü kopyalarız → build hangi OS'te koşuyorsa prebuild yalnız o
  # platformun alt-klasörünü (win-x64 / osx-arm64) indirir; diğer platformun
  # yolu OLMADIĞI için "yol yok" hatası çıkmaz. _resolve_binary bu ağacı bekler.
  # Repoya girmez (git-ignored); prebuild hook scripts/fetch_omnisharp.py ile indirir.
  # NOT: Windows=net472 (runtime hazır), macOS arm64=net6.0 (.NET 6 runtime gerekir).
  - from: ../../third_party/omnisharp
    to: omnisharp
    filter:
      - "**/*"
  # Dictation engine: whisper.cpp server + DLLs (bin/) and the large-v3-turbo q8_0
  # model (models/, 874 MB). Deliberately NOT in backend.spec: PyInstaller would put
  # them under _internal/, but the frozen backend resolves `<exe dir>/../whisper` —
  # backend.exe lives in <app>/resources/Backend/, so that path is this target.
  # Git-ignored; the prebuild hook scripts/fetch-whisper.js builds and places them
  # (Backend/vendor/build_whisper.ps1). On Windows a missing engine fails the build:
  # the product rule is that the installer carries everything a feature needs.
  - from: ../../Backend/vendor/whisper
    to: whisper
    filter:
      - "bin/**/*"
      - "models/**/*"
mac:
  extraResources:
    - from: ../../Backend/vendor/cua
      to: cua
      filter:
        - cua-driver
    - from: resources/licenses/cua-driver-LICENSE.md
      to: cua/LICENSE
  category: public.app-category.developer-tools
  # Measured 3 Sep 2026: `grep -rn NSMicrophone Frontend/frontend` → 0 hits, the key
  # existed nowhere. macOS KILLS an app whose Info.plist lacks this description the
  # moment it calls getUserMedia — the dictation button would surface on mac as a
  # crash, not as "permission denied".
  extendInfo:
    NSMicrophoneUsageDescription: "Gamachine uses the microphone only to dictate text into the chat box. Audio is transcribed on this computer and never uploaded."
  # Signing (owner decision 29 Oct 2026: Developer ID + notarization; docs/building.md).
  # The identity is not written here: electron-builder takes it from CSC_LINK +
  # CSC_KEY_PASSWORD (CI) or finds a "Developer ID Application" in the keychain.
  # Without one, scripts/sign-mac-nested.js ad-hoc signs the app as com.gamachine.app
  # and sets identity to null, so electron-builder skips signing and notarization
  # and the build succeeds exactly as before. Force a local unsigned build on a Mac
  # that has a Developer ID with: CSC_IDENTITY_AUTO_DISCOVERY=false npm run build
  hardenedRuntime: true
  # One file for the app and everything inside it:
  # - cs.allow-jit: V8 in Electron's main and renderer processes compiles JIT code.
  # - cs.allow-unsigned-executable-memory: Electron/V8 and the bundled .NET runtime
  #   (OmniSharp) still write executable pages without MAP_JIT.
  # - cs.disable-library-validation: the PyInstaller backend loads its own .so/.dylib
  #   files and Python.framework, and the .NET host loads its runtime; under the
  #   hardened runtime library validation would refuse code from those copies.
  # - device.audio-input: dictation records the microphone (NSMicrophoneUsageDescription
  #   above); the hardened runtime blocks the microphone without it.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # notarytool with the App Store Connect API key: APPLE_API_KEY (path to the .p8),
  # APPLE_API_KEY_ID, APPLE_API_ISSUER. electron-builder 24 notarizes only after it
  # signed the app, and with none of those variables it logs "skipped macOS
  # notarization" and goes on; setting only some of them fails the build.
  notarize: true
  target:
    - target: dmg
      # Apple silicon only: Intel Macs are not supported (owner decision, 16 Oct 2026).
      arch:
        - arm64
    # Squirrel.Mac (electron-updater) updates from the zip, never the dmg; the zip
    # target also writes latest-mac.yml.
    - target: zip
      arch:
        - arm64
win:
  extraResources:
    - from: ../../Backend/vendor/cua
      to: cua
      filter:
        - cua-driver.exe
    - from: resources/licenses/cua-driver-LICENSE.md
      to: cua/LICENSE
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  # ⭐ ÜÇ SÜRÜM BOYUNCA (v2.3.1 · v3.0.0/3.0.1 · v3.0.2) her seferinde elle
  # düzeltilen tuzağın kalıcı çözümü. NSIS varsayılan şablonu
  # `${productName} Setup ${version}` — içindeki BOŞLUK'u GitHub yüklerken
  # noktaya çeviriyor (`Gamachine.Setup.3.0.2.exe`), oysa `latest.yml` tireli
  # ad bekliyor → güncelleyici dosyayı bulamıyor. Şablonu tireli sabitliyoruz,
  # böylece çıktı ve `latest.yml` doğuştan aynı adı taşıyor.
  # ⚠️ Bunu değiştirirsen `latest.yml`'deki `url:` alanıyla eşleştiğini ÖLÇ.
  artifactName: ${productName}-Setup-${version}.${ext}
  # oneClick: kurulumda ÖNCEKİ sürümü otomatik kaldırır, yeniyi kurar ve açar →
  # sürümler üst üste binmez (kullanıcı eskiyi elle silmek zorunda kalmaz).
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
publish:
  provider: github
  owner: BurakErdemci
  # ⚠️ GitHub'daki repo adıyla BİREBİR eşleşmek zorunda — `app-update.yml` buradan
  # üretiliyor ve ayrışırsa güncelleme beslemesi sessizce kırılır.
  repo: gamachine
