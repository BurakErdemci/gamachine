name = "gamachine-relay"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# The worker decides what is served and adds the security headers.
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "IP_LIMITER"
class_name = "IpLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "IpLimiter"]

# Per-IP request budget checked before any Durable Object is created. Counters are per
# Cloudflare location (docs, 29 Oct 2026). If the plan does not support this binding, deploy
# reports it; the worker still runs because the code skips a missing binding.
[[ratelimits]]
name = "RELAY_RATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 120
  period = 60
