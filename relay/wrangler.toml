name = "gamachine-relay"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# The worker decides what is served and adds the security headers.
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "IP_LIMITER"
class_name = "IpLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "IpLimiter"]
