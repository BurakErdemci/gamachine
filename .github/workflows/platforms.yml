name: Platform tests (Windows + macOS)

# test.yml stays on Linux on purpose: its comment explains why a matrix there would turn
# the release gate red. This workflow measures the two platforms users actually run,
# which test.yml never does. Measured 5 Nov 2026: the first macOS run found two failures
# nobody had seen, and 18 skips hide Windows promises on Linux. It is not a release gate
# yet; move it into the gate once it has been green on both platforms.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows spends 38 minutes in pytest and more in its temp cleanup (measured 5 Nov 2026).
    # By 10 Nov a green Windows run took 43 minutes and a slow one reached 56 before the
    # runner dropped, so 60 left too little room for normal growth.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: Backend/requirements.txt
      - name: Dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.0.3 pytest-asyncio==1.3.0 uv==0.11.33
      - name: pytest
        run: python -m pytest Backend/tests -q

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        working-directory: Frontend/frontend
        run: npm ci --ignore-scripts
      - name: tsc
        working-directory: Frontend/frontend
        run: npx tsc --noEmit
      - name: vitest
        working-directory: Frontend/frontend
        run: npx vitest run
