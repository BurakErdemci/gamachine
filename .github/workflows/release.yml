name: Release (Windows + macOS)

# v* tag'i push edilince (ör. v2.1.0) her iki platformu build eder ve TASLAK release
# oluşturur. Taslak → sen inceleyip "Publish release" dersin (hiçbir şey otomatik yayınlanmaz).
# workflow_dispatch: sadece build'i test etmek için (release adımı yalnız tag'de çalışır).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # KALİTE KAPISI — build'den ÖNCE, ve bilerek `release.yml` içinden çağrılıyor.
  #
  # Hangi arızadan doğdu (dış denetim, 2026-07-28): `test.yml` `tags-ignore: ['**']`
  # taşıyordu ve gerekçesi "tag zaten test görmüş bir commit'e atılır" varsayımına
  # dayanıyordu. `git push origin <sha>:refs/tags/v1.0` bu varsayımı bozuyor: hiçbir
  # dala girmemiş bir commit tag'lenebiliyor ve buradaki build onu doğrudan
  # paketliyordu. Yani kullanıcıya ikili gitmeden önceki son an, test görmeyen tek
  # andı.
  #
  # NEDEN `workflow_call` + `needs`, "v* tag'inde test.yml'i de koştur" DEĞİL:
  # ikinci seçenek iki BAĞIMSIZ workflow üretir — testler kırmızıyken build yine
  # koşar ve taslak release yine oluşur. Görünür ama zorlayıcı olmayan bir kapı,
  # kapı değildir. `needs` ise gerçek bir kilit: kapı kırmızıysa build hiç başlamaz.
  # Çift koşu maliyeti de burada ödenmiyor — `test.yml` tag push'unda kendi başına
  # koşmuyor (`tags-ignore` orada bilerek duruyor), bu çağrı tek koşudur.
  #
  # `workflow_dispatch` yolunda da koşuyor: dispatch "build'i test et" içindir ve
  # kapısız bir build denemesi yeşil raporlarsa yanlış güven verir.
  kalite:
    name: Kalite kapısı (test.yml)
    uses: ./.github/workflows/test.yml

  build:
    name: Build (${{ matrix.os }})
    needs: kalite
    runs-on: ${{ matrix.os }}
    # The macOS job holds the Developer ID certificate and the App Store Connect
    # key, so it waits behind the `release-signing` environment (the owner creates
    # it with required reviewers; its secrets live there). Windows stays unsigned
    # and needs no environment: an empty name means none.
    environment: ${{ matrix.os == 'macos-latest' && 'release-signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend bağımlılıkları + PyInstaller
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: uv araç zinciri (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File Backend/vendor/fetch_uv.ps1

      - name: uv araç zinciri (macOS)
        if: runner.os == 'macOS'
        run: bash Backend/vendor/fetch_uv.sh

      - name: Video ikilileri — ffmpeg + yt-dlp (Windows, best-effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pwsh -File Backend/vendor/fetch_video_bins.ps1

      - name: Video ikilileri — ffmpeg + yt-dlp (macOS, best-effort)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: bash Backend/vendor/fetch_video_bins.sh

      # Dictation engine: whisper.cpp built from source at the pinned commit with
      # Vulkan, plus the pinned model; electron-builder ships it via extraResources.
      # NOT best-effort: the installer must carry everything a feature needs
      # (docs/architecture.md), so a failure here fails the build. The Vulkan SDK
      # is build-time only (shader compiler) and pinned in scripts/pinned_assets.json.
      # macOS: the Metal build is not implemented (docs/building.md); the dmg ships
      # without dictation and the prebuild hook says so in the log.
      - name: Dikte motoru — whisper.cpp + model (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File Backend/vendor/build_whisper.ps1 -InstallVulkanSdk

      - name: Backend'i dondur (PyInstaller → Backend/dist/backend)
        working-directory: Backend
        run: pyinstaller backend.spec --noconfirm

      - name: Frontend bağımlılıkları
        working-directory: Frontend/frontend
        run: npm ci

      - name: Frontend build (installer + updater feed)
        if: runner.os == 'Windows'
        working-directory: Frontend/frontend
        # ⚠️ `--publish never` ZORUNLU (ölçüldü 2 Ağu 2026, v2.3.0 tag'inde).
        # electron-builder CI'da bir tag görünce KENDİLİĞİNDEN yayınlama moduna
        # geçiyor ve `electron-builder.yml`'deki `publish: github` bloğunu
        # kullanmaya çalışıyor; `GH_TOKEN` verilmediği için "GitHub Personal
        # Access Token is not set" ile HER İKİ platform da düşüyordu. Derleme
        # aslında bitmişti — Windows exe'si ve macOS'un iki dmg'si üretildikten
        # SONRA, yalnız yayınlama adımında.
        #
        # `publish` bloğu silinemez: electron-updater'ın okuduğu `app-update.yml`
        # ondan üretiliyor, yani kaldırmak güncelleme bildirimini öldürürdü.
        # Doğru yer burası — yayınlamayı ayrı bir job yapıyor.
        run: npm run build -- --publish never

      # Same build as above (`--publish never` for the same reason), plus the signing
      # inputs. electron-builder signs with the Developer ID in CSC_LINK (base64 .p12)
      # and notarizes with the App Store Connect API key: APPLE_API_KEY must be a FILE
      # path, so the .p8 secret is written to the runner's temp dir and removed on exit.
      # Without these secrets the build still succeeds, ad-hoc signed and not notarized.
      - name: Frontend build (macOS — Developer ID signing + notarization)
        if: runner.os == 'macOS'
        working-directory: Frontend/frontend
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_file="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            trap 'rm -f "$key_file"' EXIT
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_file"
            export APPLE_API_KEY="$key_file"
          fi
          unset APPLE_API_KEY_P8
          # A missing secret arrives as "", which electron-builder treats as a certificate
          # path and fails on; unset empty ones so the ad-hoc fallback runs instead.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done
          npm run build -- --publish never

      # Only when a certificate was supplied: an unsigned build has nothing to staple
      # and Gatekeeper rejects it by design. A signed but un-notarized app fails here.
      - name: macOS imza + notarization doğrulaması
        if: runner.os == 'macOS'
        working-directory: Frontend/frontend
        env:
          HAS_CERT: ${{ secrets.CSC_LINK != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CERT" != "true" ]; then
            echo "CSC_LINK not set: unsigned build, signature checks skipped."
            exit 0
          fi
          app="build/mac-arm64/Gamachine.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vv -t exec "$app"

      - name: Artifact'ları yükle
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            Frontend/frontend/build/*.exe
            Frontend/frontend/build/*.blockmap
            Frontend/frontend/build/*.dmg
            Frontend/frontend/build/*.zip
            Frontend/frontend/build/latest*.yml

  release:
    name: Taslak GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Build artifact'larını indir
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      # ⚠️ `RELEASE_NOTES.md` ELLE güncellenen bir dosya ve bayatlayabiliyor —
      # 2 Ağu 2026'da içeriği hâlâ v2.2.0'ındı. Bu adım koşsaydı v2.3.0 release'ine
      # bir önceki sürümün notlarını basacaktı. Notlar artık `CHANGELOG.md`'de
      # sürüm başlıklarıyla tutuluyor; bu dosya onun en üst bölümünden
      # güncellenmeli. Hatırlamaya bağlı bir adım er ya da geç atlanıyor.
      - name: Taslak release oluştur + dosyaları yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Gamachine ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          files: dist-artifacts/**/*
