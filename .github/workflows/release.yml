name: Release (Windows + macOS)

# v* tag'i push edilince (ör. v2.1.0) her iki platformu build eder ve TASLAK release
# oluşturur. Taslak → sen inceleyip "Publish release" dersin (hiçbir şey otomatik yayınlanmaz).
# workflow_dispatch: sadece build'i test etmek için (release adımı yalnız tag'de çalışır).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # KALİTE KAPISI — build'den ÖNCE, ve bilerek `release.yml` içinden çağrılıyor.
  #
  # Hangi arızadan doğdu (dış denetim, 2026-07-28): `test.yml` `tags-ignore: ['**']`
  # taşıyordu ve gerekçesi "tag zaten test görmüş bir commit'e atılır" varsayımına
  # dayanıyordu. `git push origin <sha>:refs/tags/v1.0` bu varsayımı bozuyor: hiçbir
  # dala girmemiş bir commit tag'lenebiliyor ve buradaki build onu doğrudan
  # paketliyordu. Yani kullanıcıya ikili gitmeden önceki son an, test görmeyen tek
  # andı.
  #
  # NEDEN `workflow_call` + `needs`, "v* tag'inde test.yml'i de koştur" DEĞİL:
  # ikinci seçenek iki BAĞIMSIZ workflow üretir — testler kırmızıyken build yine
  # koşar ve taslak release yine oluşur. Görünür ama zorlayıcı olmayan bir kapı,
  # kapı değildir. `needs` ise gerçek bir kilit: kapı kırmızıysa build hiç başlamaz.
  # Çift koşu maliyeti de burada ödenmiyor — `test.yml` tag push'unda kendi başına
  # koşmuyor (`tags-ignore` orada bilerek duruyor), bu çağrı tek koşudur.
  #
  # `workflow_dispatch` yolunda da koşuyor: dispatch "build'i test et" içindir ve
  # kapısız bir build denemesi yeşil raporlarsa yanlış güven verir.
  kalite:
    name: Kalite kapısı (test.yml)
    uses: ./.github/workflows/test.yml

  build:
    name: Build (${{ matrix.os }})
    needs: kalite
    runs-on: ${{ matrix.os }}
    # The macOS job holds the Developer ID certificate and the App Store Connect
    # key, so it waits behind the `release-signing` environment (the owner creates
    # it with required reviewers; its secrets live there). Windows stays unsigned
    # and needs no environment: an empty name means none.
    environment: ${{ matrix.os == 'macos-latest' && 'release-signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend bağımlılıkları + PyInstaller
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: uv araç zinciri (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File Backend/vendor/fetch_uv.ps1

      - name: uv araç zinciri (macOS)
        if: runner.os == 'macOS'
        run: bash Backend/vendor/fetch_uv.sh

      - name: Video ikilileri — ffmpeg + yt-dlp (Windows, best-effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pwsh -File Backend/vendor/fetch_video_bins.ps1

      - name: Video ikilileri — ffmpeg + yt-dlp (macOS, best-effort)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: bash Backend/vendor/fetch_video_bins.sh

      # Dictation engine: whisper.cpp built from source at the pinned commit (Vulkan
      # on Windows, Metal on macOS), plus the pinned model; electron-builder ships
      # it via extraResources. NOT best-effort on either OS: the installer must
      # carry everything a feature needs (docs/architecture.md), so a failure here
      # fails the build. The Vulkan SDK is build-time only (shader compiler) and
      # pinned in scripts/pinned_assets.json.
      - name: Dikte motoru — whisper.cpp + model (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File Backend/vendor/build_whisper.ps1 -InstallVulkanSdk

      - name: Dikte motoru (macOS)
        if: runner.os == 'macOS'
        run: bash Backend/vendor/build_whisper.sh

      - name: Backend'i dondur (PyInstaller → Backend/dist/backend)
        working-directory: Backend
        run: pyinstaller backend.spec --noconfirm

      - name: Frontend bağımlılıkları
        working-directory: Frontend/frontend
        run: npm ci

      - name: Frontend build (installer + updater feed)
        if: runner.os == 'Windows'
        working-directory: Frontend/frontend
        # ⚠️ `--publish never` ZORUNLU (ölçüldü 2 Ağu 2026, v2.3.0 tag'inde).
        # electron-builder CI'da bir tag görünce KENDİLİĞİNDEN yayınlama moduna
        # geçiyor ve `electron-builder.yml`'deki `publish: github` bloğunu
        # kullanmaya çalışıyor; `GH_TOKEN` verilmediği için "GitHub Personal
        # Access Token is not set" ile HER İKİ platform da düşüyordu. Derleme
        # aslında bitmişti — Windows exe'si ve macOS'un iki dmg'si üretildikten
        # SONRA, yalnız yayınlama adımında.
        #
        # `publish` bloğu silinemez: electron-updater'ın okuduğu `app-update.yml`
        # ondan üretiliyor, yani kaldırmak güncelleme bildirimini öldürürdü.
        # Doğru yer burası — yayınlamayı ayrı bir job yapıyor.
        run: npm run build -- --publish never

      # The Developer ID (CSC_LINK, base64 .p12) goes into a keychain made here, not
      # through electron-builder: 24.13.3 runs `set-key-partition-list -k <p12 password>`
      # on its own temporary keychain, whose password is random, and macOS 26 rejects
      # that with "SecKeychainUnlock: The user name or passphrase you entered is not
      # correct" (release run 43442184911, v4.0.0). The build step then finds the
      # identity through CSC_KEYCHAIN. Without CSC_LINK nothing happens here and the
      # build stays ad-hoc signed, as before.
      - name: macOS signing keychain (Developer ID)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set: no signing keychain, the build is ad-hoc signed."
            exit 0
          fi
          kc="$RUNNER_TEMP/gamachine-signing.keychain-db"
          p12="$RUNNER_TEMP/gamachine-signing.p12"
          ca="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          trap 'rm -f "$p12" "$ca"' EXIT
          umask 077
          kc_pass="$(openssl rand -base64 32)"
          echo "::add-mask::$kc_pass"
          printf '%s' "${CSC_LINK#data:*;base64,}" | base64 --decode > "$p12"
          # The certificate's issuer, which macOS itself does not ship (only Xcode adds
          # it); without it the identity is not "valid" and signing finds nothing.
          # Pinned to the copy Apple serves (checked 13 Nov 2026, valid to 2031).
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$ca"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $ca" | shasum -a 256 -c -
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$ca" -k "$kc"
          security import "$p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" > /dev/null
          keychains=("$kc")
          while IFS= read -r line; do keychains+=("$line"); done \
            < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "${keychains[@]}"
          security find-identity -v -p codesigning "$kc" | grep '"Developer ID Application: ' > /dev/null \
            || { echo "::error::No valid Developer ID Application identity in CSC_LINK"; exit 1; }
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      # Same build as above (`--publish never` for the same reason). electron-builder
      # signs with the Developer ID from the keychain above (CSC_KEYCHAIN) and notarizes
      # with the App Store Connect API key: APPLE_API_KEY must be a FILE path, so the
      # .p8 secret is written to the runner's temp dir and removed on exit. Without
      # these secrets the build still succeeds, ad-hoc signed and not notarized.
      - name: Frontend build (macOS — Developer ID signing + notarization)
        if: runner.os == 'macOS'
        working-directory: Frontend/frontend
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_file="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            trap 'rm -f "$key_file"' EXIT
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_file"
            export APPLE_API_KEY="$key_file"
          fi
          unset APPLE_API_KEY_P8
          # A missing secret arrives as ""; setting only some notarization variables
          # fails the build, so unset empty ones and the "skipped" path runs instead.
          for name in APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done
          npm run build -- --publish never

      # Only when a certificate was supplied: an unsigned build has nothing to staple
      # and Gatekeeper rejects it by design. A signed but un-notarized app fails here.
      - name: macOS imza + notarization doğrulaması
        if: runner.os == 'macOS'
        working-directory: Frontend/frontend
        env:
          HAS_CERT: ${{ secrets.CSC_LINK != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CERT" != "true" ]; then
            echo "CSC_LINK not set: unsigned build, signature checks skipped."
            exit 0
          fi
          app="build/mac-arm64/Gamachine.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vv -t exec "$app"

      - name: macOS signing keychain cleanup
        if: always() && runner.os == 'macOS'
        # Deleting the keychain also drops it from the user search list (measured).
        run: |
          kc="$RUNNER_TEMP/gamachine-signing.keychain-db"
          if [ -e "$kc" ]; then security delete-keychain "$kc" || echo "::warning::could not delete $kc"; fi
          rm -f "$RUNNER_TEMP/gamachine-signing.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

      - name: Artifact'ları yükle
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            Frontend/frontend/build/*.exe
            Frontend/frontend/build/*.blockmap
            Frontend/frontend/build/*.dmg
            Frontend/frontend/build/*.zip
            Frontend/frontend/build/latest*.yml

  release:
    name: Taslak GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Build artifact'larını indir
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      # ⚠️ `RELEASE_NOTES.md` ELLE güncellenen bir dosya ve bayatlayabiliyor —
      # 2 Ağu 2026'da içeriği hâlâ v2.2.0'ındı. Bu adım koşsaydı v2.3.0 release'ine
      # bir önceki sürümün notlarını basacaktı. Notlar artık `CHANGELOG.md`'de
      # sürüm başlıklarıyla tutuluyor; bu dosya onun en üst bölümünden
      # güncellenmeli. Hatırlamaya bağlı bir adım er ya da geç atlanıyor.
      - name: Taslak release oluştur + dosyaları yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Gamachine ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          files: dist-artifacts/**/*
