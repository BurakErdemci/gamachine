name: Test (kalite kapısı)

# Neden bu dosya var: 2026-07-28 dış denetimi `missing-security-gate-enforcement`
# buldu — `.github/workflows/` altında yalnız `release.yml` vardı ve o hiç test
# koşturmuyor. Yani bugüne kadar eklenen bütün güvenlik kapıları (indirilen
# ikililerin özet doğrulaması, C# tablosu ↔ kütük ayrışma testi, sembolik bağ
# kapıları) YALNIZCA biri elle `pytest` yazdığında ateşleniyordu. Hatırlamaya
# bağlı bir kural bu depoda iki hafta yaşıyor; bu ölçüldü.

on:
  push:
    # `tags-ignore` KALDI ama gerekçesi değişti — eskisi yanlıştı.
    #
    # Eski gerekçe: "tag her zaman daha önce push edilmiş, yani burada zaten test
    # görmüş bir commit'e atılır". Bu VARSAYIM YANLIŞ ve dış denetimde (2026-07-28)
    # yeniden üretildi: `git push origin <sha>:refs/tags/v1.0` hiçbir dala hiç
    # girmemiş bir commit'i tag'leyebiliyor. O commit hiç test görmeden
    # `release.yml` tarafından paketleniyordu — kapı, en pahalı olduğu anda yoktu.
    #
    # Yeni gerekçe: tag yolu artık kapısız değil, `release.yml` bu workflow'u
    # `workflow_call` ile ÇAĞIRIYOR ve build/release job'ları ona `needs` ile
    # bağlı. Yani tag push'unda bu dosya yine koşuyor, sadece ikinci bir bağımsız
    # koşu olarak değil. `tags-ignore`ı kaldırsaydık aynı commit için iki tam
    # test koşusu olurdu (çift maliyet kaygısı gerçekti ve hâlâ geçerli).
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  # `release.yml`'in kapı olarak çağırabilmesi için. Girdisi yok: kapı her
  # çağrıda aynı şeyi koşmalı, çağırana göre gevşetilebilen bir kapı kapı değildir.
  workflow_call:

# Aynı dal üzerinde art arda push yapılınca eski koşuyu iptal et: kapının değeri
# "en son commit yeşil mi" sorusunda, ara commit'lerin sonucunda değil.
#
# Gruba `github.workflow` + `github.event_name` girmesi zorunlu: `workflow_call`
# ile koşulduğunda `github.ref` ÇAĞIRANIN ref'i oluyor. Yalnız ref'e baksaydık,
# `release.yml` workflow_dispatch ile main üzerinde koşarken main'e gelen sıradan
# bir push, release'in kalite kapısını `cancel-in-progress` ile iptal ederdi —
# yarıda kesilen bir kapı, GitHub'da başarısız bir kapıdır ve release'i düşürür.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # RUNNER KARARI (üç iş de ubuntu-latest, matris YOK):
  #  1. Matris testleri KIRARDI, güçlendirmezdi. Frontend testleri POSIX mutlak
  #     yol varsayıyor (`file-security.test.ts` içinde `/project/MyGame`), yani
  #     windows-latest'te kırmızı verirdi — matris eklemek yeşil kapıyı kaybettirir.
  #  2. Backend testleri platform davranışını taklit ediyor, yaşamıyor:
  #     `_platform_key` monkeypatch ile yamalanıyor (tek istisna
  #     `test_omnisharp_runtime_env.py`'deki 4 bağ testi, ve orada da x86_64 Linux
  #     `linux-x64` döndüğü için gerçek bir anahtar var — None değil).
  #  3. Gerçek platform kapsaması zaten `release.yml`'de var (windows + macos
  #     build). Buradaki matris 3× süre demek, karşılığında ölçülmüş bir kazanç yok.
  # Sınır açıkça yazılıyor: Windows'a özgü ÇALIŞMA ZAMANI davranışı (pywin32,
  # PowerShell ile süreç kimlik doğrulaması) burada da sınanmıyor — bu zaten
  # bilinen ve kabul edilmiş bir taviz, bu workflow onu kapatmıyor.

  backend:
    name: Backend testleri (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zsh, `test_cli_install.py`'nin ürettiği macOS kurulum komutlarını
      # `zsh -n` ile AYRIŞTIRDIĞI için gerekli. Kurulmazsa test kendini
      # atlıyor (yolu artık `shutil.which` ile çözüyor, sabit değil) ve
      # sözdizimi kapısı runner'da sessizce hiç koşmuyor — atlanan bir kapı,
      # olmayan kapıdan ayırt edilemez.
      - name: zsh (kurulum komutu sözdizimi kapısı için)
        run: sudo apt-get install -y --no-install-recommends zsh

      - uses: actions/setup-python@v5
        with:
          # `release.yml` ile TUTARLI olmak zorunda: `scripts/pinned_assets.py`
          # PEP 604 (`str | None`) kullanıyor ve 3.10 altında import'ta patlıyor.
          python-version: '3.13'
          cache: 'pip'
          # Cache anahtarı lockfile'a bağlı. `requirements.txt` tam pinlenmiş,
          # yani içerik değişince anahtar da değişiyor. Bayat cache'in sessizce
          # yanlış sürümü test etmesi bu depoda iki kez yaşandı.
          cache-dependency-path: Backend/requirements.txt

      - name: Bağımlılıklar
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test bağımlılıkları bilerek `requirements.txt`'te DEĞİL: o dosya
          # PyInstaller'ın dondurduğu çalışma zamanı listesi, test araçları
          # ürüne girmemeli. Sürümler yerelde 593 testin yeşil olduğu sürümlere
          # sabitlendi; pinsiz bırakılırsa bir pytest major sürümü kapıyı
          # ürün değişmeden kırar.
          pip install pytest==9.0.3 pytest-asyncio==1.3.0

      # `python -m pytest` (çıplak `pytest` değil) ve depo kökünden koşuluyor:
      # yerelde yeşil ölçülen tam çağrı bu. `asyncio_mode = auto` ayarı
      # `Backend/pytest.ini`'den geliyor, pytest onu `Backend/tests`'ten yukarı
      # çıkarak buluyor.
      - name: pytest
        run: python -m pytest Backend/tests -q

  # Neden AYRI bir job: `unity-mcp/Server` ayrı bir Python paketi (kendi
  # `pyproject.toml`'u, kendi bağımlılık ağacı — fastmcp/fastapi/uvicorn).
  # Backend job'ının içine sıkıştırmak iki bağımlılık kümesini tek ortamda
  # çakıştırırdı.
  #
  # Neden ŞİMDİ eklendi (31 Tem 2026): bu suite bugüne kadar CI'da HİÇ koşmadı,
  # yalnız biri elle `pytest` yazdığında ateşleniyordu — ve onay kapısını
  # (K1) koruyan her şey burada: action kütüğünün 6 tripwire'ı, kapı
  # kablolamasının mutasyon testi, `execute_code` şema tripwire'ı. Yani bu
  # dosyanın en başındaki gerekçenin ("hatırlamaya bağlı bir kural bu depoda
  # iki hafta yaşıyor") kapsamı dışında kalmış en büyük yüzeydi.
  unity-mcp-server:
    name: unity-mcp Server testleri (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Backend job'ı ile aynı sürüm. `Server/pyproject.toml` 3.10+ diyor
          # ama iki job'ı ayrıştırmanın bir kazancı yok ve tek sürüm, "yerelde
          # hangi yorumlayıcıyla ölçtük" sorusunu tek cevaplı tutuyor.
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: unity-mcp/Server/pyproject.toml

      - name: Bağımlılıklar
        working-directory: unity-mcp/Server
        run: |
          python -m pip install --upgrade pip
          # `-e .` installs the package's own dependencies from pyproject
          # (fastmcp and mcp are pinned exactly there, to what production runs).
          pip install -e .
          # Test araçları AYRI ve SABİT sürümle — `[dev]` extra'sı
          # `pytest>=8.0.0` diyor, yani bir major sürüm ürün değişmeden kapıyı
          # kırabilirdi. Backend job'ı ile birebir aynı sürümler: iki suite
          # farklı pytest'lerle koşarsa "hangi kapı ne ölçtü" cevapsız kalır.
          pip install pytest==9.0.3 pytest-asyncio==1.3.0

      # `tests/conftest.py` `src`'yi kendisi `sys.path`e ekliyor, o yüzden
      # PYTHONPATH gerekmiyor. Yerelde bu tam çağrıyla 1522 test yeşil ölçüldü.
      - name: pytest
        working-directory: unity-mcp/Server
        run: python -m pytest tests -q

  frontend:
    name: Frontend kapısı (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `release.yml` ile aynı. Alt sınır serbest değil: vite 8 ve rolldown
          # `^20.19.0 || >=22.12.0` istiyor, yani 20 hattının SON minor'ı gerekiyor.
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/frontend/package-lock.json

      # `--ignore-scripts` kasıtlı: `postinstall` → `electron-builder
      # install-app-deps`, node-pty'yi Electron için yeniden derliyor ve node-pty
      # yalnız darwin/win32 için prebuild taşıyor → Linux'ta kaynaktan derleme.
      # Bu kapının ihtiyacı yok: vitest testleri yalnız `main/helpers` ve
      # `renderer` TypeScript'ini yüklüyor, hiçbir native modül import etmiyor;
      # tsc ise paketin `.d.ts`'iyle yetiniyor. Platforma özgü ikililer
      # (rolldown, lightningcss) optionalDependencies olarak lock'ta duruyor ve
      # install script'i gerektirmiyor.
      - name: Bağımlılıklar
        working-directory: Frontend/frontend
        run: npm ci --ignore-scripts

      # `__tests__/workspace-fingerprint-parity.test.ts` is the ONLY thing that
      # runs both `gamachine-ws-fp-2` implementations, and it needs a Python to
      # run the backend one. Without this step it selected `describe.skip`, its
      # six cases reported "skipped", and `vitest` stayed green — a gate that
      # measured nothing (AUDIT R6-02, 31 Aug 2026).
      #
      # This step PINS the interpreter to 3.13 so the CI measurement matches
      # the version the backend targets, instead of silently drifting with
      # whatever Python the runner image happens to ship. It is NOT the sole
      # source of Python on the runner, so deleting it does not disarm the
      # gate: `ubuntu-latest` already ships a `python3` on PATH (the Ubuntu
      # 24.04 image lists Python 3.12.3), and the parity test's interpreter
      # search (`pythonBul()`) probes `python3`/`python` from PATH, so the
      # suite would keep finding an interpreter and stay green, just measured
      # against a different Python version.
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
      #
      # What actually disarms the gate is an environment with no Python at
      # all — that is why the test throws at module load when `CI` is set,
      # instead of falling back to `describe.skip`.
      #
      # No dependencies are installed and no venv is built: the module it
      # imports (`Backend/app/workspace_fingerprint.py`) is standard library
      # only, which is why it was split out of the FastAPI route file.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: TypeScript (tsc --noEmit)
        working-directory: Frontend/frontend
        run: npx tsc --noEmit

      - name: vitest
        working-directory: Frontend/frontend
        run: npx vitest run

  powershell:
    name: PowerShell sözdizimi denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Neden burada: geliştirme makinesinde `pwsh` YOK, o yüzden
      # `Backend/vendor/*.ps1` bugüne kadar hiçbir araçtan sözdizimi denetimi
      # görmedi. Ürünün ana kitlesi Windows ve bir yazım hatası şu an ancak tag
      # atıldıktan SONRA, release build'inin ortasında görünüyor. GitHub
      # runner'larında pwsh kurulu geliyor — boşluk burada kapanıyor.
      #
      # PARSE, çalıştırma değil: bu betikler ağdan ikili indiriyor.
      #
      # Denetimin sınırı açık olsun: bu adım sözdizimini yakalar, çalışma zamanı
      # hatasını değil. Ayrıca parser pwsh 7'nin parser'ı — `release.yml` de
      # betikleri `pwsh` ile çağırdığı için yorumlayıcı eşleşiyor, ama Windows
      # PowerShell 5.1 farkları burada görünmez.
      - name: Her .ps1 dosyasını ayrıştır
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # `@(...)` zorunlu: tek dosya bulunduğunda Get-ChildItem skaler döner
          # ve `.Count` beklenen anlamı vermez.
          # Filtre yalnız YABANCI ağaçları eliyor (`node_modules`, `venv`,
          # `.venv` — oradaki `activate.ps1` bizim kodumuz değil ve zaten
          # .gitignore'da). Temiz bir checkout'ta hiçbiri yok; filtre yerel
          # koşuya karşı. `build`/`dist` bilerek ELENMİYOR: temiz checkout'ta
          # yoklar, varsa da bunu bilmek isteriz.
          # `.venv` açıkça yazılı — PowerShell'in Unix'te nokta ile başlayan
          # yolları gizli sayıp atlamasına güvenmek örtük bir bağımlılık olurdu.
          $dosyalar = @(
            Get-ChildItem -Path . -Filter '*.ps1' -Recurse -File |
              Where-Object { $_.FullName -notmatch '[\\/]\.?(node_modules|venv)[\\/]' }
          )

          Write-Host "Bulunan .ps1 dosyası: $($dosyalar.Count)"

          # Sıfır dosyada YEŞİL VERMEK, tam olarak kapatmaya çalıştığımız
          # "sessiz no-op" sınıfı olurdu: dosyalar taşınır, adım hiçbir şey
          # denetlemez, kapı yine de yeşil yanar.
          if ($dosyalar.Count -eq 0) {
            Write-Host "::error::Hiç .ps1 bulunamadı — bu adım sessizce hiçbir şey denetlemedi."
            exit 1
          }

          $bozuk = 0
          foreach ($dosya in $dosyalar) {
            $hatalar = $null
            $goreli = [System.IO.Path]::GetRelativePath($PWD.Path, $dosya.FullName)
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $dosya.FullName, [ref]$null, [ref]$hatalar
            )
            if ($hatalar -and $hatalar.Count -gt 0) {
              $bozuk++
              Write-Host "HATA  $goreli ($($hatalar.Count) sözdizimi hatası)"
              foreach ($hata in $hatalar) {
                $satir = $hata.Extent.StartLineNumber
                $sutun = $hata.Extent.StartColumnNumber
                Write-Host "::error file=$goreli,line=$satir,col=$sutun::$($hata.Message)"
              }
            } else {
              Write-Host "OK    $goreli"
            }
          }

          if ($bozuk -gt 0) {
            Write-Host "::error::$bozuk dosyada sözdizimi hatası var."
            exit 1
          }
          Write-Host "$($dosyalar.Count) dosyanın hepsi ayrıştı."
